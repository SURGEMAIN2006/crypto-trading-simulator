<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Crypto Trading Simulator & Blockchain Ledger | Group 1 Project</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- React & ReactDOM & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --bg-primary: #07090e;
      --bg-card: rgba(18, 24, 38, 0.75);
      --border-color: rgba(255, 255, 255, 0.08);
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent-green: #00e676;
      --accent-green-bg: rgba(0, 230, 118, 0.12);
      --accent-red: #ff1744;
      --accent-red-bg: rgba(255, 23, 68, 0.12);
      --accent-cyan: #00e5ff;
      --accent-purple: #a855f7;
      --accent-gold: #ffd700;
      --font-sans: 'Inter', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-sans);
      min-height: 100vh;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(0, 229, 255, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(168, 85, 247, 0.05) 0%, transparent 40%);
    }

    .mono { font-family: var(--font-mono); }

    .glass-panel {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.6rem 1.2rem;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 8px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.2s ease;
      outline: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, #00e5ff 0%, #0088ff 100%);
      color: #000;
    }

    .btn-buy {
      background: linear-gradient(135deg, #00e676 0%, #00b0ff 100%);
      color: #05190e;
    }

    .btn-sell {
      background: linear-gradient(135deg, #ff1744 0%, #ff5252 100%);
      color: #fff;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-primary);
      border-color: var(--border-color);
    }

    .btn-sm { padding: 0.35rem 0.75rem; font-size: 0.75rem; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.25rem 0.6rem;
      border-radius: 12px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .badge-purple { background: rgba(168, 85, 247, 0.15); color: var(--accent-purple); border: 1px solid rgba(168, 85, 247, 0.3); }
    .badge-green { background: var(--accent-green-bg); color: var(--accent-green); border: 1px solid rgba(0, 230, 118, 0.3); }
    .badge-red { background: var(--accent-red-bg); color: var(--accent-red); border: 1px solid rgba(255, 23, 68, 0.3); }
    .badge-gold { background: rgba(255, 215, 0, 0.15); color: var(--accent-gold); border: 1px solid rgba(255, 215, 0, 0.3); }

    .pulse { animation: pulse 2s infinite ease-in-out; }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.5;} }

    .app-container { max-width: 1600px; margin: 0 auto; padding: 1.25rem; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const CRYPTO_ASSETS = [
      { id: 'bitcoin', symbol: 'BTC', name: 'Bitcoin', icon: '₿', price: 65420.50, change24h: 3.42, high24h: 66100.00, low24h: 63200.00, volume24h: '32.4B USDT', marketCap: '1.28T USD', color: '#F7931A' },
      { id: 'ethereum', symbol: 'ETH', name: 'Ethereum', icon: 'Ξ', price: 3480.25, change24h: -1.15, high24h: 3560.00, low24h: 3410.00, volume24h: '18.9B USDT', marketCap: '418B USD', color: '#627EEA' },
      { id: 'solana', symbol: 'SOL', name: 'Solana', icon: '◎', price: 145.80, change24h: 5.84, high24h: 148.50, low24h: 136.20, volume24h: '4.2B USDT', marketCap: '67.8B USD', color: '#14F195' },
      { id: 'binancecoin', symbol: 'BNB', name: 'BNB Chain', icon: '❖', price: 580.10, change24h: 0.95, high24h: 588.00, low24h: 572.50, volume24h: '1.8B USDT', marketCap: '87.1B USD', color: '#F3BA2F' },
      { id: 'ripple', symbol: 'XRP', name: 'XRP Ledger', icon: '✕', price: 0.584, change24h: 2.10, high24h: 0.602, low24h: 0.565, volume24h: '1.1B USDT', marketCap: '32.5B USD', color: '#23292F' },
      { id: 'cardano', symbol: 'ADA', name: 'Cardano', icon: '₳', price: 0.452, change24h: -2.35, high24h: 0.478, low24h: 0.441, volume24h: '650M USDT', marketCap: '16.2B USD', color: '#0033AD' }
    ];

    function generateHistory(price) {
      const data = [];
      let p = price * 0.96;
      for (let i = 0; i < 30; i++) {
        p = p * (1 + (Math.random() - 0.48) * 0.02);
        data.push({ time: `${i}:00`, price: Number(p.toFixed(price < 1 ? 4 : 2)), open: p, high: p*1.01, low: p*0.99, close: p });
      }
      return data;
    }

    function generateHash() {
      const chars = '0123456789abcdef';
      let h = '0x';
      for (let i = 0; i < 64; i++) h += chars[Math.floor(Math.random() * chars.length)];
      return h;
    }

    function App() {
      const [activeTab, setActiveTab] = useState('trade');
      const [assets, setAssets] = useState(CRYPTO_ASSETS);
      const [selectedAsset, setSelectedAsset] = useState(CRYPTO_ASSETS[0]);
      const [chartData, setChartData] = useState(() => generateHistory(CRYPTO_ASSETS[0].price));
      
      const [userBalance, setUserBalance] = useState(10000.00);
      const [userHoldings, setUserHoldings] = useState({ BTC: 0.1, ETH: 1.0 });
      const [orderSide, setOrderSide] = useState('BUY');
      const [amount, setAmount] = useState('0.1');

      const [transactions, setTransactions] = useState([
        { id: '1', symbol: 'BTC', type: 'BUY', amount: 0.1, price: 65200, totalUSD: 6520, timestamp: '14:20:10', txHash: generateHash(), status: 'SUCCESS' }
      ]);

      const [blocks, setBlocks] = useState([
        { index: 104289, timestamp: '14:00:00', hash: generateHash(), validator: 'Node-01 (Pritam Lead)', txs: 14 }
      ]);

      // Ticker interval
      useEffect(() => {
        const timer = setInterval(() => {
          setAssets(prev => prev.map(a => {
            const delta = (Math.random() - 0.49) * 0.008;
            const newP = Math.max(0.001, a.price * (1 + delta));
            return { ...a, price: Number(newP.toFixed(a.price < 1 ? 4 : 2)) };
          }));
        }, 2000);
        return () => clearInterval(timer);
      }, []);

      const handleExecute = (e) => {
        e.preventDefault();
        const amt = parseFloat(amount) || 0;
        if (amt <= 0) return;
        const totalUSD = amt * selectedAsset.price;

        if (orderSide === 'BUY') {
          if (totalUSD > userBalance) return alert('Insufficient USDT balance');
          setUserBalance(b => b - totalUSD);
          setUserHoldings(h => ({ ...h, [selectedAsset.symbol]: (h[selectedAsset.symbol] || 0) + amt }));
        } else {
          if (amt > (userHoldings[selectedAsset.symbol] || 0)) return alert(`Insufficient ${selectedAsset.symbol} holdings`);
          setUserBalance(b => b + totalUSD);
          setUserHoldings(h => ({ ...h, [selectedAsset.symbol]: Math.max(0, (h[selectedAsset.symbol] || 0) - amt) }));
        }

        const newTx = {
          id: String(Date.now()),
          symbol: selectedAsset.symbol,
          type: orderSide,
          amount: amt,
          price: selectedAsset.price,
          totalUSD,
          timestamp: new Date().toLocaleTimeString(),
          txHash: generateHash(),
          status: 'SUCCESS'
        };

        setTransactions(t => [newTx, ...t]);

        setBlocks(b => [
          { index: b[0].index + 1, timestamp: new Date().toLocaleTimeString(), hash: generateHash(), validator: 'Node-01 (Group 1)', txs: Math.floor(Math.random() * 10 + 1) },
          ...b
        ]);

        alert(`${orderSide} Order Executed successfully! Hash: ${newTx.txHash.slice(0, 16)}...`);
      };

      const totalVal = userBalance + Object.entries(userHoldings).reduce((acc, [s, q]) => {
        const a = assets.find(item => item.symbol === s);
        return acc + (a ? q * a.price : 0);
      }, 0);

      return (
        <div>
          {/* Header */}
          <header className="glass-panel" style={{ borderRadius: 0, padding: '0.8rem 1.5rem', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: '0.8rem' }}>
              <div style={{ width: 38, height: 38, borderRadius: 10, background: 'linear-gradient(135deg, #00e5ff 0%, #a855f7 100%)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 900, color: '#000' }}>
                CS
              </div>
              <div>
                <h1 style={{ fontSize: '1.2rem', fontWeight: 800 }}>CRYPTO<span style={{ color: 'var(--accent-cyan)' }}>SIM</span></h1>
                <span className="badge badge-purple">Group 1 Project (Pritam, Shravani, Vishakha, Vijaya)</span>
              </div>
            </div>

            <nav style={{ display: 'flex', gap: '0.4rem', background: 'rgba(0,0,0,0.3)', padding: '0.25rem', borderRadius: 10 }}>
              {['trade', 'portfolio', 'orderbook', 'blockchain', 'analytics'].map(tab => (
                <button
                  key={tab}
                  onClick={() => setActiveTab(tab)}
                  className="btn btn-sm"
                  style={{
                    background: activeTab === tab ? 'rgba(0,229,255,0.2)' : 'transparent',
                    color: activeTab === tab ? 'var(--accent-cyan)' : 'var(--text-secondary)',
                    border: activeTab === tab ? '1px solid rgba(0,229,255,0.4)' : '1px solid transparent'
                  }}
                >
                  {tab.toUpperCase()}
                </button>
              ))}
            </nav>

            <div style={{ textAlign: 'right' }}>
              <div style={{ fontSize: '0.7rem', color: 'var(--text-muted)' }}>TESTNET BALANCE</div>
              <div className="mono" style={{ fontSize: '1.1rem', fontWeight: 800, color: 'var(--accent-green)' }}>
                ${totalVal.toLocaleString('en-US', { minimumFractionDigits: 2 })}
              </div>
            </div>
          </header>

          {/* Asset Ticker Bar */}
          <div style={{ background: 'rgba(10,14,23,0.9)', borderBottom: '1px solid var(--border-color)', padding: '0.6rem 1.5rem', display: 'flex', gap: '1rem', overflowX: 'auto' }}>
            {assets.map(a => (
              <div
                key={a.id}
                onClick={() => { setSelectedAsset(a); setChartData(generateHistory(a.price)); }}
                style={{
                  padding: '0.4rem 0.8rem',
                  background: selectedAsset.id === a.id ? 'rgba(0,229,255,0.15)' : 'rgba(255,255,255,0.03)',
                  border: selectedAsset.id === a.id ? '1px solid var(--accent-cyan)' : '1px solid var(--border-color)',
                  borderRadius: 8,
                  cursor: 'pointer',
                  minWidth: 140
                }}
              >
                <div style={{ fontSize: '0.8rem', fontWeight: 700 }}>{a.symbol}/USDT</div>
                <div className="mono" style={{ fontSize: '0.85rem', color: a.change24h >= 0 ? 'var(--accent-green)' : 'var(--accent-red)' }}>
                  ${a.price} ({a.change24h >= 0 ? '+' : ''}{a.change24h}%)
                </div>
              </div>
            ))}
          </div>

          <main className="app-container">
            {activeTab === 'trade' && (
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 340px', gap: '1.25rem' }}>
                {/* SVG Chart Panel */}
                <div className="glass-panel" style={{ padding: '1.5rem', display: 'flex', flexDirection: 'column', gap: '1rem' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                    <h2>{selectedAsset.name} ({selectedAsset.symbol}/USDT)</h2>
                    <div className="mono" style={{ fontSize: '1.4rem', fontWeight: 800, color: 'var(--accent-cyan)' }}>${selectedAsset.price}</div>
                  </div>
                  
                  <div style={{ height: 320, background: 'rgba(0,0,0,0.5)', borderRadius: 10, padding: '1rem', position: 'relative' }}>
                    <svg viewBox="0 0 800 300" style={{ width: '100%', height: '100%' }}>
                      <polyline
                        fill="none"
                        stroke="var(--accent-cyan)"
                        strokeWidth="3"
                        points={chartData.map((d, i) => {
                          const minP = Math.min(...chartData.map(c=>c.price));
                          const maxP = Math.max(...chartData.map(c=>c.price));
                          const x = (i / (chartData.length - 1)) * 760 + 20;
                          const y = 280 - ((d.price - minP) / (maxP - minP || 1)) * 240;
                          return `${x},${y}`;
                        }).join(' ')}
                      />
                    </svg>
                  </div>
                </div>

                {/* Trading Execution Box */}
                <div className="glass-panel" style={{ padding: '1.25rem', display: 'flex', flexDirection: 'column', gap: '1rem' }}>
                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '0.5rem' }}>
                    <button className="btn" style={{ background: orderSide === 'BUY' ? 'var(--accent-green)' : 'transparent', color: orderSide === 'BUY' ? '#000' : '#fff' }} onClick={() => setOrderSide('BUY')}>BUY</button>
                    <button className="btn" style={{ background: orderSide === 'SELL' ? 'var(--accent-red)' : 'transparent', color: orderSide === 'SELL' ? '#fff' : '#fff' }} onClick={() => setOrderSide('SELL')}>SELL</button>
                  </div>

                  <form onSubmit={handleExecute} style={{ display: 'flex', flexDirection: 'column', gap: '0.8rem' }}>
                    <div>
                      <label style={{ fontSize: '0.75rem', color: 'var(--text-secondary)' }}>Amount ({selectedAsset.symbol}):</label>
                      <input type="number" step="any" value={amount} onChange={e => setAmount(e.target.value)} className="mono" style={{ width: '100%', padding: '0.6rem', background: '#000', color: '#fff', border: '1px solid var(--border-color)', borderRadius: 6 }} />
                    </div>

                    <div style={{ background: 'rgba(0,0,0,0.3)', padding: '0.6rem', borderRadius: 6, fontSize: '0.75rem' }}>
                      <div>Total Value: ${(parseFloat(amount) * selectedAsset.price || 0).toFixed(2)} USDT</div>
                      <div>Available USDT: ${userBalance.toFixed(2)}</div>
                    </div>

                    <button type="submit" className={`btn ${orderSide === 'BUY' ? 'btn-buy' : 'btn-sell'}`} style={{ width: '100%', padding: '0.8rem' }}>
                      EXECUTE {orderSide}
                    </button>
                  </form>
                </div>
              </div>
            )}

            {activeTab === 'portfolio' && (
              <div className="glass-panel" style={{ padding: '1.5rem' }}>
                <h2>User Portfolio & Net Worth</h2>
                <p style={{ marginTop: '0.5rem', color: 'var(--text-secondary)' }}>Liquid Cash: ${userBalance.toFixed(2)} USDT</p>
                <div style={{ marginTop: '1.5rem' }}>
                  <h3>Active Holdings</h3>
                  {Object.entries(userHoldings).map(([s, q]) => (
                    <div key={s} style={{ display: 'flex', justifyContent: 'space-between', padding: '0.6rem 0', borderBottom: '1px solid var(--border-color)' }}>
                      <span>{s}</span>
                      <span className="mono">{q} {s}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === 'orderbook' && (
              <div className="glass-panel" style={{ padding: '1.5rem' }}>
                <h2>Order Book Depth Walls (Bids & Asks)</h2>
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '2rem', marginTop: '1rem' }}>
                  <div>
                    <h3 style={{ color: 'var(--accent-red)' }}>ASKS (Sellers)</h3>
                    <div className="mono" style={{ marginTop: '0.5rem', fontSize: '0.85rem' }}>
                      <div style={{ color: 'var(--accent-red)' }}>${(selectedAsset.price * 1.002).toFixed(2)} - 0.45 {selectedAsset.symbol}</div>
                      <div style={{ color: 'var(--accent-red)' }}>${(selectedAsset.price * 1.005).toFixed(2)} - 1.20 {selectedAsset.symbol}</div>
                    </div>
                  </div>
                  <div>
                    <h3 style={{ color: 'var(--accent-green)' }}>BIDS (Buyers)</h3>
                    <div className="mono" style={{ marginTop: '0.5rem', fontSize: '0.85rem' }}>
                      <div style={{ color: 'var(--accent-green)' }}>${(selectedAsset.price * 0.998).toFixed(2)} - 0.85 {selectedAsset.symbol}</div>
                      <div style={{ color: 'var(--accent-green)' }}>${(selectedAsset.price * 0.995).toFixed(2)} - 2.10 {selectedAsset.symbol}</div>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'blockchain' && (
              <div className="glass-panel" style={{ padding: '1.5rem' }}>
                <h2>Simulated Blockchain Ledger</h2>
                <div style={{ marginTop: '1rem', display: 'flex', flexDirection: 'column', gap: '0.8rem' }}>
                  {blocks.map(b => (
                    <div key={b.index} style={{ background: 'rgba(0,0,0,0.4)', padding: '0.8rem', borderRadius: 8, border: '1px solid var(--border-color)' }}>
                      <div className="mono" style={{ color: 'var(--accent-cyan)' }}>Block #{b.index} - Hash: {b.hash}</div>
                      <div style={{ fontSize: '0.75rem', color: 'var(--text-muted)', marginTop: '0.2rem' }}>Validator: {b.validator} | Timestamp: {b.timestamp}</div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === 'analytics' && (
              <div className="glass-panel" style={{ padding: '1.5rem' }}>
                <h2>Data Science & Survey Paper Phase</h2>
                <p style={{ marginTop: '0.5rem', color: 'var(--text-secondary)' }}>
                  Survey report text ready for submission. Group 1: Pritam Acharekar, Shravani Bandekar, Vishakha Bankar, Vijaya Ingale.
                </p>
                <textarea
                  readOnly
                  rows={8}
                  style={{ width: '100%', marginTop: '1rem', background: '#000', color: 'var(--text-secondary)', padding: '1rem', borderRadius: 8 }}
                  value={`SURVEY PAPER REPORT: CRYPTO TRADING SIMULATOR
Group 1 Members: Pritam Acharekar, Shravani Bandekar, Vishakha Bankar, Vijaya Ingale

1. Ingestion: Streaming real-time ticks for BTC/ETH/SOL.
2. Analytics: Fear & Greed index calculated at 74 (Greed).
3. Hashing: SHA-256 block ledger hashing verified.`}
                />
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
